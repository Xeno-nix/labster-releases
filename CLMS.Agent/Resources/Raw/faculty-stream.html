<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faculty live stream</title>
<style>
html,body{margin:0;height:100%;background:#080d18;color:#fff;font:16px system-ui}
body{display:flex;flex-direction:column}video{width:100%;flex:1;min-height:0;object-fit:contain}
p{padding:12px 20px;margin:0;text-align:center;color:#cbd5e1}button{margin:8px auto;padding:8px 20px}
</style>
<body>
<video id="screen" autoplay muted playsinline></video>
<p id="status" role="status">Connecting to the faculty's screen…</p>
<button id="play" hidden>Play live stream</button>
<script>
let peer, cancelGather;
const video = document.getElementById('screen');
const status = document.getElementById('status');
const play = document.getElementById('play');
play.onclick = () => video.play().then(() => play.hidden = true);
window.stopStream = () => {
    const current = peer;
    peer = null;
    cancelGather?.();
    cancelGather = null;
    if (current) { current.ontrack = null; current.onconnectionstatechange = null; current.close(); }
    video.srcObject = null;
    play.hidden = true;
    status.textContent = 'Live stream ended.';
};
window.receiveOffer = async sdp => {
    let current;
    let stage = 'unsupported_webrtc';
    try {
        window.stopStream();
        window.broadcastResult = null;
        status.textContent = 'Connecting to the faculty’s screen…';
        current = new RTCPeerConnection({ iceServers: [] });
        peer = current;
        current.ontrack = event => {
            video.srcObject = event.streams[0] || new MediaStream([event.track]);
            video.play().catch(() => { if (peer === current) play.hidden = false; });
        };
        current.onconnectionstatechange = () => {
            status.textContent = current.connectionState === 'connected' ? 'Faculty live stream · Screen only'
                : current.connectionState === 'failed' ? 'Connection failed. Ask the faculty to restart the live stream.'
                : current.connectionState === 'disconnected' ? 'Reconnecting to the faculty’s screen…' : 'Connecting…';
        };
        stage = 'offer_rejected';
        await current.setRemoteDescription({ type: 'offer', sdp });
        if (peer !== current) return;
        stage = 'answer_failed';
        await current.setLocalDescription(await current.createAnswer());
        if (peer !== current) return;
        stage = 'ice_timeout';
        await new Promise((resolve, reject) => {
            if (current.iceGatheringState === 'complete') { resolve(); return; }
            const finish = error => {
                clearTimeout(timeout);
                current.onicegatheringstatechange = null;
                cancelGather = null;
                error ? reject(error) : resolve();
            };
            const timeout = setTimeout(() => finish(new Error('ICE timeout')), 10000);
            cancelGather = () => finish(new Error('Live stream stopped'));
            current.onicegatheringstatechange = () => {
                if (current.iceGatheringState === 'complete') finish();
            };
        });
        if (peer === current) window.broadcastResult = { sdp: current.localDescription.sdp };
    } catch {
        if (current && peer !== current) return;
        window.broadcastResult = { error: stage };
        status.textContent = 'The live stream could not connect on this workstation.';
    }
};
// Keep the native bridge result synchronous; negotiation completes through broadcastResult.
window.startFacultyOffer = sdp => { void window.receiveOffer(sdp); return true; };
window.facultyViewerReady = true;
</script>
</body>
</html>
